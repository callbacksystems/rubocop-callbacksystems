# Cops that were removed or renamed, so a project inheriting an older config
# gets a pointed error instead of a bare "unrecognized cop" warning.

removed:
  Callbacksystems/PrivateMethodArgumentClump:
    alternatives: Callbacksystems/DataClump
    reason: >
      it reported a subset of what `Callbacksystems/DataClump` reports, so the
      two put two messages on one refactor. `DataClump` now covers the repeated
      signature from two methods (`MinMethodsForRepeatedSignature`), and catches
      shared cores and names woven through varying combinations besides

  Callbacksystems/OrderedMixinArguments:
    reason: >
      sorting the arguments of `include`, `extend` or `prepend` changes the
      ancestor chain, and with it which module's method wins. `include A, B` and
      `include B, A` are different programs, so there is no order the cop could
      impose without risking a behaviour change
