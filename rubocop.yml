# Callbacksystems Ruby Style

require:
  - rubocop-callbacksystems

plugins:
  - rubocop-minitest
  - rubocop-performance
  - rubocop-rails

AllCops:
  NewCops: enable
  TargetRubyVersion: 4.0
  ActiveSupportExtensionsEnabled: true
  SuggestExtensions: false
  Exclude:
    - app/controllers/concerns/authentication.rb
    - "app/channels/application_cable/**/*"
    - "bin/**/*"
    - "config/**/*"
    - "db/**/*"
    - "gems/**/*"
    - "node_modules/**/*"
    - "test/test_helper.rb"
    - "tmp/**/*"
    - "vendor/**/*"


# Callbacksystems

Callbacksystems/ApplicationControllerMethodDefinition:
  Enabled: true
  Include:
    - "app/controllers/application_controller.rb"

Callbacksystems/BuilderMethodParentheses:
  Enabled: true
  Exclude:
    - "app/helpers/**/*"

Callbacksystems/CollapseMultilineExpression:
  Enabled: true
  MaxLineLength: 120

Callbacksystems/ComplexConditional:
  Enabled: true
  MaxOperators: 1

Callbacksystems/ControllerTestResponseAssertion:
  Enabled: true
  Include:
    - "test/controllers/**/*"

Callbacksystems/ControllerTestResponseFirstAssertion:
  Enabled: true
  Include:
    - "test/controllers/**/*"

Callbacksystems/DataClump:
  Enabled: true
  MinParams: 3
  MinMethods: 3

Callbacksystems/EagerLoadingScopeNaming:
  Enabled: true
  Include:
    - "app/models/**/*"

Callbacksystems/EarlyReturn:
  Enabled: true

Callbacksystems/EmptyLineBeforeMethod:
  Enabled: true

Callbacksystems/InlineMemoizedComputation:
  Enabled: true

Callbacksystems/JobEnqueueMethods:
  Enabled: true
  Include:
    - "app/models/**/*"

Callbacksystems/MethodInvocationOrder:
  Enabled: true
  Include:
    - "app/models/**/*"

Callbacksystems/NestedClassesAtEndOfPrivateSection:
  Enabled: true

Callbacksystems/NoAbbreviations:
  Enabled: true

Callbacksystems/NoAnemicDelegationMethod:
  Enabled: true

Callbacksystems/NoAssertSelect:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/NoBangMethodWithoutCounterpart:
  Enabled: true

Callbacksystems/NoCallMethod:
  Enabled: true

Callbacksystems/NoCommentsInTestClassBody:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/NoDirectEagerLoading:
  Enabled: true
  Include:
    - "app/controllers/**/*"

Callbacksystems/NoEachWithEarlyReturn:
  Enabled: true

Callbacksystems/NoExplicitPublicModifier:
  Enabled: true

Callbacksystems/NoExtractMethodNaming:
  Enabled: true

Callbacksystems/NoLocalVariableReturn:
  Enabled: true

Callbacksystems/NoManualAccumulation:
  Enabled: true

Callbacksystems/NoMixedMemoization:
  Enabled: true

Callbacksystems/NoNestedModulesInClasses:
  Enabled: true

Callbacksystems/NoNilAtEndOfMethod:
  Enabled: true

Callbacksystems/NoRedundantWrapperMethod:
  Enabled: true

Callbacksystems/NoServiceObjects:
  Enabled: true

Callbacksystems/NoSingletonClassInModules:
  Enabled: true

Callbacksystems/NoTapCollectionBuilding:
  Enabled: true

Callbacksystems/OrderedMixinArguments:
  Enabled: true

Callbacksystems/PluralControllerNames:
  Enabled: true
  IgnoredNames:
    - Application
    - Base
  Include:
    - "app/controllers/**/*"

Callbacksystems/PreferAttrReaderOverInstanceVariable:
  Enabled: true

Callbacksystems/PreferBackslashContinuation:
  Enabled: true

Callbacksystems/PreferDeclarativeCollections:
  Enabled: true

Callbacksystems/PreferExcluding:
  Enabled: true

Callbacksystems/PreferMany:
  Enabled: true

Callbacksystems/PreferMethodOverVariable:
  Enabled: true
  Exclude:
    - "test/**/*"

Callbacksystems/PreferOrdinalArrayAccess:
  Enabled: true

Callbacksystems/PreferSquish:
  Enabled: true

Callbacksystems/PreferStringifyKeys:
  Enabled: true

Callbacksystems/PreferSymbolizeKeys:
  Enabled: true

Callbacksystems/PrivateMethodArgumentClump:
  Enabled: true
  MinParams: 2
  MinMethods: 3

Callbacksystems/PrivateNestedClasses:
  Enabled: true

Callbacksystems/PrivateNestedClassMethodVisibility:
  Enabled: true

Callbacksystems/PublicMethodsMustHaveTests:
  Enabled: true
  Include:
    - "app/**/*"
    - "lib/**/*"

Callbacksystems/RedundantConcernExtend:
  Enabled: true

Callbacksystems/RepeatedFixtureInTests:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/RestrictedControllerActions:
  Enabled: true
  Include:
    - "app/controllers/**/*"

Callbacksystems/RoutesModuleScope:
  Enabled: true
  Include:
    - "config/routes.rb"
    - "config/routes/**/*"

Callbacksystems/SingleLineSetupBlock:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/SingleTopLevelClassOrModule:
  Enabled: true

Callbacksystems/SingleUseFixtureVariable:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/SingleUseSetupVariable:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/SingularScopeNames:
  Enabled: true
  Include:
    - "app/models/**/*"

Callbacksystems/TestMethodDefinition:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/TestMethodOrder:
  Enabled: true
  Include:
    - "test/**/*"

Callbacksystems/TooManyInstanceVariables:
  Enabled: true
  MaxAssignments: 2

Callbacksystems/TooManyLocalVariables:
  Enabled: true
  MaxAssignments: 3

Callbacksystems/UnusedPrivateMethodInNestedClass:
  Enabled: true


# Bundler

Bundler/OrderedGems:
  Enabled: false


# Layout

Layout/AccessModifierIndentation:
  Enabled: false

Layout/ArgumentAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/ArrayAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/CaseIndentation:
  EnforcedStyle: end

Layout/ClassStructure:
  Enabled: true
  ExpectedOrder:
    - module_inclusion
    - association
    - public_attribute_macros
    - public_delegate
    - macros
    - public_class_methods
    - initializer
    - public_methods
    - protected_attribute_macros
    - protected_methods
    - private_attribute_macros
    - private_delegate
    - private_methods
  Categories:
    module_inclusion:
      - include
      - prepend
      - extend
    association:
      - belongs_to
      - has_many
      - has_one
      - has_and_belongs_to_many
      - accepts_nested_attributes_for
    macros:
      - normalizes
      - scope
      - positioned
      - encrypts
      - enum
      - serialize
      - store
      - store_accessor
      - validates
      - validate
      - validates_with
      - after_initialize
      - after_find
      - before_validation
      - after_validation
      - before_save
      - around_save
      - after_save
      - before_create
      - around_create
      - after_create
      - before_update
      - around_update
      - after_update
      - before_destroy
      - around_destroy
      - after_destroy
      - after_commit
      - after_create_commit
      - after_update_commit
      - after_destroy_commit
      - after_save_commit
      - after_rollback
      - before_action
      - around_action
      - after_action
      - skip_before_action
      - skip_after_action
      - skip_around_action
      - helper_method
      - layout
      - rescue_from
      - allow_browser

Layout/ClosingParenthesisIndentation:
  Enabled: false

Layout/EmptyLinesAfterModuleInclusion:
  Enabled: true

Layout/EmptyLinesAroundAccessModifier:
  EnforcedStyle: only_before

Layout/EmptyLinesAroundAttributeAccessor:
  Enabled: true
  AllowedMethods:
    - delegate
    - delegate_missing_to

Layout/EndAlignment:
  EnforcedStyleAlignWith: variable

Layout/FirstHashElementIndentation:
  Enabled: false

Layout/FirstHashElementLineBreak:
  Enabled: false

Layout/HashAlignment:
  Enabled: false

Layout/IndentationConsistency:
  EnforcedStyle: indented_internal_methods

Layout/IndentationWidth:
  Width: 2

Layout/LineEndStringConcatenationIndentation:
  EnforcedStyle: indented

Layout/LineLength:
  Enabled: false

Layout/MultilineMethodCallIndentation:
  EnforcedStyle: indented

Layout/MultilineOperationIndentation:
  EnforcedStyle: indented

Layout/ParameterAlignment:
  EnforcedStyle: with_fixed_indentation

Layout/RedundantLineBreak:
  Enabled: false

Layout/SpaceInsideArrayLiteralBrackets:
  EnforcedStyle: space
  EnforcedStyleForEmptyBrackets: no_space

Layout/SpaceInsideBlockBraces:
  EnforcedStyleForEmptyBraces: space

Layout/SpaceInsideHashLiteralBraces:
  EnforcedStyle: space
  EnforcedStyleForEmptyBraces: no_space

Layout/SpaceInsidePercentLiteralDelimiters:
  Enabled: false


# Lint

Lint/AmbiguousBlockAssociation:
  Enabled: false

Lint/AmbiguousOperator:
  Enabled: false

Lint/AmbiguousRegexpLiteral:
  Enabled: false

Lint/AssignmentInCondition:
  Enabled: false

Lint/DuplicateBranch:
  Enabled: true

Lint/DuplicateMatchPattern:
  Enabled: true

Lint/DuplicateRegexpCharacterClassElement:
  Enabled: true

Lint/DuplicateSetElement:
  Enabled: true

Lint/NoReturnInBeginEndBlocks:
  Enabled: false

Lint/NonAtomicFileOperation:
  Enabled: true

Lint/NumericOperationWithConstantResult:
  Enabled: true

Lint/OrAssignmentToConstant:
  Enabled: true

Lint/RedundantDirGlobSort:
  Enabled: true

Lint/RedundantRegexpQuantifiers:
  Enabled: true

Lint/RedundantTypeConversion:
  Enabled: true

Lint/RequireParentheses:
  Enabled: false

Lint/RequireRangeParentheses:
  Enabled: true

Lint/RequireRelativeSelfPath:
  Enabled: true

Lint/SuppressedException:
  Enabled: false

Lint/SymbolConversion:
  Enabled: true

Lint/UnescapedBracketInRegexp:
  Enabled: true

Lint/UnexpectedBlockArity:
  Enabled: true

Lint/UnmodifiedReduceAccumulator:
  Enabled: true

Lint/UnusedMethodArgument:
  Enabled: false

Lint/UselessAccessModifier:
  Enabled: false

Lint/UselessConstantScoping:
  Enabled: false

Lint/UselessNumericOperation:
  Enabled: true

Lint/UselessOr:
  Enabled: true

Lint/UselessRescue:
  Enabled: true

Lint/UselessRuby2Keywords:
  Enabled: true


# Metrics

Metrics/AbcSize:
  Max: 25

Metrics/BlockLength:
  Enabled: false

Metrics/ClassLength:
  Max: 200
  Exclude:
    - "test/**/*"

Metrics/MethodLength:
  Max: 20


# Naming

Naming/AccessorMethodName:
  Enabled: false

Naming/BlockForwarding:
  EnforcedStyle: explicit

Naming/PredicateMethod:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Naming/VariableNumber:
  Exclude:
    - "test/**/*"


# Performance

Performance/TimesMap:
  Enabled: false


# Rails

Rails/ActionOrder:
  ExpectedOrder:
    - index
    - show
    - new
    - create
    - edit
    - update
    - destroy

Rails/AttributeDefaultBlockValue:
  Enabled: false

Rails/DynamicFindBy:
  Enabled: false

Rails/EnumHash:
  Enabled: false

Rails/HasManyOrHasOneDependent:
  Enabled: false

Rails/Inquiry:
  Enabled: false

Rails/SkipsModelValidations:
  Enabled: false

Rails/TimeZoneAssignment:
  Enabled: false


# Minitest

Minitest/AssertEmpty:
  Enabled: true

Minitest/MultipleAssertions:
  Max: 5

Minitest/AssertEmptyLiteral:
  Enabled: true

Minitest/AssertEqual:
  Enabled: true

Minitest/AssertIncludes:
  Enabled: true

Minitest/AssertInstanceOf:
  Enabled: true

Minitest/AssertKindOf:
  Enabled: true

Minitest/AssertMatch:
  Enabled: true

Minitest/AssertNil:
  Enabled: true

Minitest/AssertOperator:
  Enabled: true

Minitest/AssertPathExists:
  Enabled: true

Minitest/AssertPredicate:
  Enabled: false

Minitest/AssertRespondTo:
  Enabled: true

Minitest/AssertSame:
  Enabled: true

Minitest/AssertSilent:
  Enabled: true

Minitest/AssertTruthy:
  Enabled: true

Minitest/AssertWithExpectedArgument:
  Enabled: true

Minitest/LiteralAsActualArgument:
  Enabled: true

Minitest/RefuteEmpty:
  Enabled: false

Minitest/RefuteEqual:
  Enabled: false

Minitest/RefuteFalse:
  Enabled: false

Minitest/RefuteIncludes:
  Enabled: false

Minitest/RefuteInstanceOf:
  Enabled: false

Minitest/RefuteKindOf:
  Enabled: false

Minitest/RefuteMatch:
  Enabled: false

Minitest/RefuteNil:
  Enabled: false

Minitest/RefuteOperator:
  Enabled: false

Minitest/RefutePathExists:
  Enabled: false

Minitest/RefutePredicate:
  Enabled: false

Minitest/RefuteRespondTo:
  Enabled: false

Minitest/RefuteSame:
  Enabled: false

Minitest/UnspecifiedException:
  Enabled: true

Minitest/UselessAssertion:
  Enabled: true


# Style

Style/AndOr:
  Enabled: false

Style/ArgumentsForwarding:
  Enabled: false

Style/ArrayFirstLast:
  Enabled: true

Style/ArrayIntersect:
  Enabled: true

Style/ArrayIntersectWithSingleElement:
  Enabled: true

Style/AutoResourceCleanup:
  Enabled: true

Style/BlockDelimiters:
  EnforcedStyle: line_count_based

Style/ClassAndModuleChildren:
  EnforcedStyle: compact

Style/ClassMethodsDefinitions:
  EnforcedStyle: self_class

Style/CollectionCompact:
  Enabled: true

Style/CollectionQuerying:
  Enabled: true

Style/ComparableBetween:
  Enabled: true

Style/DataInheritance:
  Enabled: false

Style/DirEmpty:
  Enabled: true

Style/DisableCopsWithinSourceCodeDirective:
  Enabled: true

Style/Documentation:
  Enabled: false

Style/DocumentationMethod:
  Enabled: false

Style/EmptyCaseCondition:
  Enabled: false

Style/EmptyElse:
  Enabled: false

Style/EmptyMethod:
  EnforcedStyle: expanded

Style/EmptyStringInsideInterpolation:
  Enabled: true

Style/ExactRegexpMatch:
  Enabled: true

Style/ExplicitBlockArgument:
  Enabled: false

Style/FileEmpty:
  Enabled: true

Style/FileRead:
  Enabled: true

Style/FileTouch:
  Enabled: true

Style/FileWrite:
  Enabled: true

Style/FrozenStringLiteralComment:
  Enabled: true
  EnforcedStyle: never

Style/GlobalStdStream:
  Enabled: false

Style/GuardClause:
  Enabled: false

Style/HashAsLastArrayItem:
  Enabled: false

Style/HashExcept:
  Enabled: true

Style/HashLikeCase:
  Enabled: false

Style/HashSlice:
  Enabled: true

Style/IfUnlessModifier:
  Enabled: false

Style/IfWithBooleanLiteralBranches:
