# RuboCop config for the rubocop-callbacksystems gem itself

inherit_from: rubocop.yml

plugins:
  - rubocop-callbacksystems
  - rubocop-internal_affairs

Callbacksystems/PublicMethodsMustHaveTests:
  Exclude:
    - "lib/rubocop/cop/**/*"

Naming/FileName:
  Exclude:
    - "lib/rubocop-callbacksystems.rb"

# Disable cops that conflict with pure Ruby (no ActiveSupport extensions on Array/Set)
Rails/NegateInclude:
  Enabled: false

Style/InvertibleUnlessCondition:
  Enabled: false
